<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Screening Siti RealStep</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: three-pane workbench (site register | criterion worksheet | live verdict), plus portfolio, gap and method views */
:root{
  --bg:#F1F6F6; --surface:#FFFFFF; --sunk:#E5EEEF; --ink:#102A2D; --muted:#4D6568; --line:#D0DEDF;
  --navy:#005059; --on-navy:#FFFFFF; --accent:#007C86; --accent-soft:#DDEFF0; --focus:#00707A;
  --s5:#2F8F46; --s5b:#D7F0DC; --s4:#6BAE3E; --s4b:#E6F4D8; --s3:#B39A12; --s3b:#F6F0CC; --s2:#D9822B; --s2b:#FBE6D0; --s1:#C8372D; --s1b:#F8DAD7;
  --vb:#D7F0DC; --db:#E3ECFA; --sb:#F6F0CC;
  --sans:"Work Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A1517; --surface:#112022; --sunk:#172B2E; --ink:#E3EFF0; --muted:#94AEB1; --line:#24393C;
  --navy:#003A41; --on-navy:#EAF6F7; --accent:#4CC6CE; --accent-soft:#123638; --focus:#5FD3DB;
  --s5:#5CC774; --s5b:#1D3A26; --s4:#97CF6A; --s4b:#263A1D; --s3:#E0C447; --s3b:#3A3518; --s2:#F0A35A; --s2b:#3D2A17; --s1:#F2776C; --s1b:#3F1F1D;
  --vb:#1D3A26; --db:#1C2A42; --sb:#3A3518; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0A1517; --surface:#112022; --sunk:#172B2E; --ink:#E3EFF0; --muted:#94AEB1; --line:#24393C;
  --navy:#003A41; --on-navy:#EAF6F7; --accent:#4CC6CE; --accent-soft:#123638; --focus:#5FD3DB;
  --s5:#5CC774; --s5b:#1D3A26; --s4:#97CF6A; --s4b:#263A1D; --s3:#E0C447; --s3b:#3A3518; --s2:#F0A35A; --s2b:#3D2A17; --s1:#F2776C; --s1b:#3F1F1D;
  --vb:#1D3A26; --db:#1C2A42; --sb:#3A3518; color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:var(--on-navy)}
.top-in{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:10px;max-width:1500px;margin:0 auto}
.brand-row{display:flex;align-items:center;gap:14px;min-width:0}
.logo{height:24px;width:auto;display:block;padding-right:14px;border-right:1px solid rgba(255,255,255,.3)}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand b{font-size:16px;font-weight:700;letter-spacing:.01em}
.brand span{font-size:11px;opacity:.75;letter-spacing:.06em;text-transform:uppercase}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{background:transparent;border:1px solid transparent;color:var(--on-navy);opacity:.75;padding:6px 12px;border-radius:999px;cursor:pointer;font-weight:500}
.tab:hover{opacity:1;border-color:rgba(255,255,255,.25)}
.tab[aria-current="page"]{opacity:1;background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3)}
.sync{margin-left:auto;font-size:12px;display:flex;align-items:center;gap:6px;opacity:.9}
.dot{width:8px;height:8px;border-radius:50%;background:var(--s4)}
.dot.busy{background:var(--s3)} .dot.off{background:var(--s1)}
.banner{background:var(--accent-soft);color:var(--ink);font-size:13px;padding-block:8px;border-bottom:1px solid var(--line)}
.banner[hidden]{display:none}

main{max-width:1500px;margin:0 auto;padding-block:18px 40px}
.view[hidden]{display:none!important}

/* site view */
.bench{display:grid;grid-template-columns:250px minmax(0,1fr) 290px;gap:18px;align-items:start}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.reg{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 100px);overflow:auto}
.reg-h{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.reg-h h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.reg-h select{font-size:12px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 4px}
.site-btn{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;text-align:left;padding:9px 12px;border:0;border-bottom:1px solid var(--line);background:transparent;cursor:pointer}
.site-btn:hover{background:var(--sunk)}
.site-btn[aria-current="true"]{background:var(--sunk);box-shadow:inset 3px 0 0 var(--accent)}
.site-btn .id{font-family:var(--mono);font-size:12px;color:var(--muted)}
.site-btn .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.site-btn .meta{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;width:48px}
.bar i{display:block;height:100%;background:var(--navy)}
:root[data-theme="dark"] .bar i{background:var(--on-navy)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .bar i{background:var(--on-navy)} }
.sel-mobile{display:none}

.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--ink)}
.p-ok{background:var(--s5b);color:var(--s5)} .p-cond{background:var(--s2b);color:var(--s2)} .p-low{background:var(--s1b);color:var(--s1)}
.p-ko{background:var(--s1b);color:var(--s1);text-decoration:line-through} .p-prog{background:var(--sunk);color:var(--muted)}
.mini{font-family:var(--mono);font-size:12px;font-weight:600;min-width:28px;text-align:right}

/* editor */
.ed-head{padding:18px 20px;border-bottom:1px solid var(--line)}
.ed-head .eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.ed-head h2{font-size:24px;font-weight:700;margin-top:2px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px 18px;margin-top:14px}
.fact span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.fact b{font-weight:600}
.pre{margin-top:14px;padding:10px 12px;background:var(--sunk);border-radius:6px;font-size:13px}
.pre b{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}
.inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:14px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
.f input,.f select,.f textarea,.note{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 9px;color:var(--ink);font-size:13px;width:100%;min-width:0}
.f textarea{min-height:58px;resize:vertical}

.step{padding:18px 20px;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.step-h .k{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:600}
.step-h h3{font-size:17px}
.step-h p{margin:0;color:var(--muted);font-size:13px;flex-basis:100%}

.ko-row{display:grid;grid-template-columns:minmax(0,1.2fr) auto minmax(0,1.4fr);gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.ko-row:first-of-type{border-top:0}
.ko-row .t b{display:block} .ko-row .t span{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 10px;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button:hover{background:var(--sunk)}
.seg button[aria-pressed="true"].no{background:var(--s5b);color:var(--s5)}
.seg button[aria-pressed="true"].tbd{background:var(--s3b);color:var(--s3)}
.seg button[aria-pressed="true"].yes{background:var(--s1b);color:var(--s1)}
.seg button[aria-pressed="true"].V{background:var(--vb);color:var(--s5)}
.seg button[aria-pressed="true"].D{background:var(--db);color:var(--focus)}
.seg button[aria-pressed="true"].S{background:var(--sb);color:var(--s3)}
.ko-out{margin-top:10px;font-size:13px;display:flex;gap:8px;align-items:center}

.dim{margin-top:6px}
.dim-h{display:flex;align-items:center;gap:10px;padding:10px 0 6px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);background:var(--surface);z-index:2}
.dim-h b{font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.dim-h .w{font-family:var(--mono);font-size:12px;color:var(--muted)}
.dim-h .ds{margin-left:auto}
.crit{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.crit.done{border-color:color-mix(in srgb,var(--line) 40%,var(--s4))}
.crit-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.crit-h .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.crit-h b{font-size:15px}
.chip{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 7px;color:var(--muted)}
.crit-h .chips{margin-left:auto;display:flex;gap:6px}
.q{margin:4px 0 10px;color:var(--muted);font-size:13px}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 8px 8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.opt:hover{border-color:var(--muted)}
.opt .v{font-family:var(--mono);font-weight:600;font-size:15px}
.opt .d{font-size:11.5px;line-height:1.3;color:var(--muted)}
.opt[data-v="5"] .v{color:var(--s5)} .opt[data-v="4"] .v{color:var(--s4)} .opt[data-v="3"] .v{color:var(--s3)} .opt[data-v="2"] .v{color:var(--s2)} .opt[data-v="1"] .v{color:var(--s1)}
.opt[aria-pressed="true"][data-v="5"]{background:var(--s5b);border-color:var(--s5)}
.opt[aria-pressed="true"][data-v="4"]{background:var(--s4b);border-color:var(--s4)}
.opt[aria-pressed="true"][data-v="3"]{background:var(--s3b);border-color:var(--s3)}
.opt[aria-pressed="true"][data-v="2"]{background:var(--s2b);border-color:var(--s2)}
.opt[aria-pressed="true"][data-v="1"]{background:var(--s1b);border-color:var(--s1)}
.opt[aria-pressed="true"] .d{color:var(--ink)}
.crit-f{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;margin-top:10px}
.crit-f .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-right:4px}
.hint{font-size:12px;color:var(--muted);margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.hint a{color:var(--focus);text-decoration:none} .hint a:hover{text-decoration:underline}
.hint em{font-style:normal}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 11px;cursor:pointer;font-weight:600;font-size:12px;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.clear{font-size:11px;color:var(--muted);background:none;border:0;cursor:pointer;text-decoration:underline;padding:0}

/* verdict */
.verdict{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
.vd{padding:16px}
.vd .eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.big{display:flex;align-items:baseline;gap:8px;margin:6px 0 8px}
.big .num{font-size:46px;font-weight:600;line-height:1}
.big small{color:var(--muted);font-size:13px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:13px;margin-top:12px;align-items:center}
.kv span{color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:4px;grid-column:1/-1}
.meter i{display:block;height:100%}
.dims{margin-top:14px;display:grid;gap:7px}
.drow{display:grid;grid-template-columns:96px minmax(0,1fr) 30px;gap:8px;align-items:center;font-size:12px}
.dtrack{height:8px;background:var(--sunk);border-radius:4px;position:relative;overflow:hidden}
.dtrack i{position:absolute;inset:0 auto 0 0;border-radius:4px}
.quad{margin-top:14px;padding:10px 12px;border-radius:6px;background:var(--sunk);font-size:13px}
.quad b{display:block}
.last{font-size:11px;color:var(--muted);margin-top:12px}

/* portfolio */
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile span{font-size:12px;color:var(--muted)}
.tile b{display:block;font-family:var(--mono);font-size:26px;font-weight:600}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;font-weight:600;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--sunk)}
td.c,th.c{text-align:center}
.sect-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.sect-h h2{font-size:16px}
.sect-h .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
svg text{fill:var(--muted);font-family:var(--sans)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}

/* gap */
.gapform{display:grid;grid-template-columns:150px 170px minmax(0,1fr) 140px 140px auto;gap:10px;align-items:end;padding:14px 16px;border-bottom:1px solid var(--line)}
td select,td input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 6px;font-size:12px}

/* method */
.meth{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.prose{padding:16px 18px;font-size:14px;max-width:68ch}
.prose h3{font-size:15px;margin:14px 0 4px}
.prose p{margin:0 0 8px}
.wt input{width:70px;text-align:right}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--on-navy);padding:8px 14px;border-radius:6px;font-size:13px;z-index:20}

@media (max-width:1180px){ .bench{grid-template-columns:220px minmax(0,1fr)} .verdict{grid-column:1/-1;position:static;order:-1} .vd{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 24px} }
@media (max-width:820px){
  .bench{grid-template-columns:minmax(0,1fr)} .reg{display:none} .sel-mobile{display:block;margin-bottom:12px}
  .scale{grid-template-columns:minmax(0,1fr)} .opt{flex-direction:row;align-items:baseline;gap:10px}
  .ko-row{grid-template-columns:minmax(0,1fr)} .crit-f{grid-template-columns:minmax(0,1fr)}
  .grid2,.meth{grid-template-columns:minmax(0,1fr)} .gapform{grid-template-columns:minmax(0,1fr)}
  .dim-h{position:static}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ---------------- scoring ---------------- */
function compute(s){
  const P=S.params,W=P.weights;let tot=0,comp=0,sum=0,conf=0;const sc=s.scores||{};
  CRIT.forEach(c=>{const k="c"+c.n,w=+W[k]||0,v=sc[k]||{};tot+=w;if(v.s){comp+=w;sum+=v.s*w;if(v.conf==="V"||v.conf==="D")conf+=w}});
  tot=tot||1;
  const score=comp?sum/comp:null;
  const dims={};DIMS.forEach(d=>{let a=0,b=0;d.ids.forEach(n=>{const v=sc["c"+n]||{},w=+W["c"+n]||0;if(v.s){a+=v.s*w;b+=w}});dims[d.c]=b?a/b:null});
  const ko=s.ko||{};const kv=KO.map(k=>ko[k.c]);
  const koOut=kv.includes("Sì")?"Escluso":kv.includes("Da verificare")?"Da verificare":kv.every(x=>x==="No")?"Superato":"Da compilare";
  const compR=comp/tot,confR=conf/tot,r1=score==null?null:Math.round(score*10)/10;
  let cls;
  if(koOut==="Escluso")cls="Non idoneo";else if(score==null)cls="Da compilare";else if(compR<P.tComp)cls="In corso";
  else cls=r1>=P.tIdoneo?"Idoneo":r1>=P.tCond?"Idoneo con condizioni":"Bassa idoneità";
  let quad="–";
  if(koOut==="Escluso")quad="Escluso dal filtro";
  else if(score!=null&&compR>=P.tComp)quad=r1>=P.tAlto?(confR>=P.tConf?"Prioritario":"Promettente da verificare"):(confR>=P.tConf?"Da scartare":"Approfondire solo se strategico");
  return{score,comp:compR,conf:confR,dims,koOut,cls,quad};
}
function ranks(){const arr=sitesArr().map(s=>({id:s.id,r:compute(s)})).filter(x=>x.r.koOut!=="Escluso"&&x.r.score!=null);
  const out={};arr.forEach(x=>{out[x.id]=1+arr.filter(y=>y.r.score>x.r.score).length});return out}

function setSync(kind,txt){const d=$("#syncdot");d.className="dot"+(kind==="busy"?" busy":kind==="off"?" off":"");$("#synctxt").textContent=txt}

function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}
function patchSite(id,patch){
  if(!S.canWrite&&S.mode==="db"){toast("Hai accesso in sola lettura.");return}
  merge(S.sites[id],clone(patch));afterChange(id);
  if(S.mode!=="db")return;
  pending[id]=merge(pending[id]||{},clone(patch));
  clearTimeout(timers[id]);timers[id]=setTimeout(()=>flush(id),550);setSync("busy","Salvataggio…");
}
function flush(id){
  const p=pending[id];if(!p)return;delete pending[id];
  p.updatedAt=new Date().toISOString();if(S.uid)p.updatedBy=S.uid;
  inflight++;
  chains[id]=(chains[id]||Promise.resolve()).then(()=>db.doc("sites/"+id).update(p)).then(()=>{inflight--;if(!inflight&&!Object.keys(pending).length)setSync("ok","Salvato")},e=>{inflight--;writeErr(e)});
}
function writeErr(e){
  const c=e&&e.code;
  if(c==="invalid_argument"){S.canWrite=false;banner("Il tuo accesso a questo tool è in sola lettura: le modifiche non vengono salvate. Chiedi al proprietario l'accesso come Contributor.");setSync("off","Sola lettura")}
  else if(c==="quota_exceeded"){setSync("off","Archivio pieno");banner("L'archivio del tool è pieno: elimina voci chiuse dalla Gap list.")}
  else{setSync("off","Non salvato");toast("Salvataggio non riuscito. Riprova tra qualche secondo.")}
}

  const act=document.activeElement;
  const setVal=(el,v)=>{if(el&&el!==act)el.value=v??""};
  setVal($("#mwMin"),s.mwMin);setVal($("#mwMax"),s.mwMax);setVal($("#archetype"),s.archetype);setVal($("#anNotes"),s.notes);
  const ko=s.ko||{},kon=s.koNotes||{};
  document.querySelectorAll("[data-ko]").forEach(b=>b.setAttribute("aria-pressed",ko[b.dataset.ko]===b.dataset.val));
  KO.forEach(k=>setVal($("#kon-"+k.c),kon[k.c]));
  const sc=s.scores||{};
  CRIT.forEach(c=>{const v=sc["c"+c.n]||{};
    document.querySelectorAll(`[data-crit="${c.n}"]`).forEach(b=>b.setAttribute("aria-pressed",String(v.s)===b.dataset.v));
    document.querySelectorAll(`[data-conf="${c.n}"]`).forEach(b=>b.setAttribute("aria-pressed",v.conf===b.dataset.val));
    setVal($("#note-"+c.n),v.note);
    $("#cr-"+c.n).classList.toggle("done",!!(v.s&&v.conf));
  });
  const r=compute(s);
  DIMS.forEach(d=>{const e=$("#ds-"+d.c);e.textContent=fmt1(r.dims[d.c]);e.style.color=sCol(r.dims[d.c])});
  const ko2={"Escluso":"p-ko","Superato":"p-ok","Da verificare":"p-cond"}[r.koOut]||"p-prog";
  $("#koOut").innerHTML=`Esito del filtro: <span class="pill ${ko2}" style="text-decoration:none">${r.koOut}</span>`;
}

/* ---------------- orchestration ---------------- */
function afterChange(id){renderList();if(S.view==="sito"&&id===S.sel){syncEditor();renderVerdict()}if(S.view==="portafoglio")renderPortfolio()}
function renderAll(rebuild){renderList();if(S.view==="sito"){if(rebuild||!$("#editor .ed-head")||$("#editor").dataset.site!==S.sel){buildEditor();$("#editor").dataset.site=S.sel||""}else syncEditor();renderVerdict()}
  if(S.view==="portafoglio")renderPortfolio();if(S.view==="gap")renderGaps();if(S.view==="metodo")renderMethod()}
function selectSite(id){S.sel=id;try{localStorage.setItem("rs-sel",id)}catch(e){}go("sito");renderAll(true);window.scrollTo({top:0})}
function go(view){S.view=view;document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-current",t.dataset.view===view?"page":"false"));
  ["sito","portafoglio","gap","metodo"].forEach(v=>$("#v-"+v).hidden=v!==view);
  const h=view==="sito"?"":view;if((location.hash||"").slice(1)!==h){try{history.replaceState(null,"",h?"#"+h:location.pathname+location.search)}catch(e){location.hash=h}}
  renderAll(false)}

/* events */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,g[data-site],tr[data-site]");if(!t)return;
  if(t.classList.contains("tab")){go(t.dataset.view);return}
  if(t.dataset.site&&(t.classList.contains("site-btn")||t.tagName==="g"||t.tagName==="TR")){selectSite(t.dataset.site);return}
  const id=S.sel;
  if(t.dataset.crit){const n=t.dataset.crit,v=+t.dataset.v;const cur=(S.sites[id].scores||{})["c"+n]||{};patchSite(id,{scores:{["c"+n]:{s:cur.s===v?null:v}}});return}
  if(t.dataset.conf){const n=t.dataset.conf;const cur=(S.sites[id].scores||{})["c"+n]||{};patchSite(id,{scores:{["c"+n]:{conf:cur.conf===t.dataset.val?null:t.dataset.val}}});return}
  if(t.dataset.ko){const cur=(S.sites[id].ko||{})[t.dataset.ko];patchSite(id,{ko:{[t.dataset.ko]:cur===t.dataset.val?null:t.dataset.val}});return}
  if(t.dataset.clear){patchSite(id,{scores:{["c"+t.dataset.clear]:{s:null,conf:null,note:""}}});return}
  if(t.dataset.addgap){go("gap");$("#g-site").value=id;$("#g-crit").value=t.dataset.addgap;$("#g-text").focus();return}
  if(t.id==="csv"){exportCsv();return}
  if(t.id==="resetP"){saveParams(clone(DEF));return}
  if(t.dataset.gdel){if(t.dataset.confirm!=="1"){t.dataset.confirm="1";t.textContent="Conferma";setTimeout(()=>{if(t.isConnected){t.dataset.confirm="0";t.textContent="Elimina"}},3000);return}
    delGap(t.dataset.gdel);return}
});
const noteTimers={};
document.addEventListener("input",e=>{
  const t=e.target,id=S.sel;
  const later=(k,fn)=>{clearTimeout(noteTimers[k]);noteTimers[k]=setTimeout(fn,500)};
  if(t.dataset.note)later("n"+t.dataset.note,()=>patchSite(id,{scores:{["c"+t.dataset.note]:{note:t.value}}}));
  else if(t.dataset.konote)later("k"+t.dataset.konote,()=>patchSite(id,{koNotes:{[t.dataset.konote]:t.value}}));
  else if(t.id==="anNotes")later("an",()=>patchSite(id,{notes:t.value}));
  else if(t.id==="mwMin"||t.id==="mwMax")later(t.id,()=>patchSite(id,{[t.id]:t.value===""?null:+t.value}));
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="archetype")patchSite(S.sel,{archetype:t.value||null});
  if(t.id==="sitesel")selectSite(t.value);
  if(t.id==="sortsel"){S.sort=t.value;renderList()}
  if(t.id==="gapf"){S.gapFilter=t.value;renderGaps()}
  if(t.dataset.gstatus)updGap(t.dataset.gstatus,{status:t.value});
  if(t.dataset.w||t.dataset.p){const P=clone(S.params);
    if(t.dataset.w)P.weights[t.dataset.w]=(+t.value||0)/100;else P[t.dataset.p]=t.dataset.pct==="1"?(+t.value||0)/100:+t.value;saveParams(P)}
});
document.addEventListener("submit",e=>{if(e.target.id!=="gapform")return;e.preventDefault();
  const g={siteId:$("#g-site").value,crit:$("#g-crit").value,text:$("#g-text").value.trim(),to:$("#g-to").value,due:$("#g-due").value||null,status:"Aperto",createdAt:new Date().toISOString(),createdBy:S.uid||null};
  if(!g.text)return;addGap(g)});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(["portafoglio","gap","metodo"].includes(h))go(h);else if(!h)go("sito")});

/* gaps + params persistence */
async function addGap(g){
  if(S.mode!=="db"){g.id="local"+Date.now();S.gaps.push(g);renderGaps();toast("Voce aggiunta (solo in questa vista)");return}
  try{await db.collection("gaps").add(g);toast("Voce aggiunta alla Gap list")}catch(e){writeErr(e)}}
async function updGap(id,p){if(S.mode!=="db"){Object.assign(S.gaps.find(g=>g.id===id)||{},p);renderGaps();return}
  try{await db.doc("gaps/"+id).update(p)}catch(e){writeErr(e)}}
async function delGap(id){if(S.mode!=="db"){S.gaps=S.gaps.filter(g=>g.id!==id);renderGaps();return}
  try{await db.doc("gaps/"+id).delete();toast("Voce eliminata")}catch(e){writeErr(e)}}
let pChain=Promise.resolve();
function saveParams(P){S.params=P;renderAll(true);if(S.mode!=="db")return;
  pChain=pChain.then(()=>db.doc("config/params").set(P)).then(()=>toast("Parametri aggiornati per tutto il team"),e=>{toast("Solo chi ha accesso Editor può cambiare pesi e soglie.")})}

async function exportCsv(){
  const rk=ranks();const head=["ID","Sito","Prov","Cluster","Filtro","E1","E2","E3","E4","Completamento","Punteggio","Classe","Confidenza","Quadrante","Ranking","MW min","MW max","Archetipo",...DIMS.map(d=>d.c+" "+d.n),...CRIT.map(c=>"C"+c.n+" punteggio"),...CRIT.map(c=>"C"+c.n+" confidenza"),...CRIT.map(c=>"C"+c.n+" nota"),"Note analista"];
  const q=v=>{const s=v==null?"":String(v);return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const num=v=>v==null?"":String(Math.round(v*100)/100).replace(".",",");
  const lines=[head.map(q).join(";")];
  sitesArr().filter(s=>s.num).forEach(s=>{const r=compute(s),sc=s.scores||{},ko=s.ko||{};
    lines.push([s.num,s.name,s.prov,s.cluster,r.koOut,ko.E1,ko.E2,ko.E3,ko.E4,num(r.comp),num(r.score),r.cls,num(r.conf),r.quad,rk[s.id]||"",s.mwMin,s.mwMax,s.archetype,...DIMS.map(d=>num(r.dims[d.c])),...CRIT.map(c=>(sc["c"+c.n]||{}).s),...CRIT.map(c=>(sc["c"+c.n]||{}).conf),...CRIT.map(c=>(sc["c"+c.n]||{}).note),s.notes].map(q).join(";"))});
  const data="﻿"+lines.join("\r\n");
  if(!downloads)downloads=window.claude&&window.claude.use?await window.claude.use("downloads").catch(()=>null):null;
  if(!downloads){toast("L'esportazione non è disponibile in questa vista.");return}
  try{await downloads.save({filename:"RealStep_screening_siti.csv",data});toast("CSV esportato")}catch(e){if(e&&e.code!=="declined")toast("Esportazione non riuscita.")}
}

/* ---------------- boot ---------------- */
function localMode(msg){S.mode="local";S.loaded=true;S.sites={es:clone(EXAMPLE)};S.sel="es";setSync("off","Non collegato");banner(msg);renderAll(true)}
async function boot(){
  try{const h=location.hash.slice(1);if(["portafoglio","gap","metodo"].includes(h))S.view=h;}catch(e){}
  go(S.view);
  if(!window.claude||!window.claude.use){localMode("Questa copia non è collegata all'archivio del progetto: vedi un sito di esempio e le modifiche non vengono salvate.");return}
  [db,user]=await Promise.all([window.claude.use("db").catch(()=>null),window.claude.use("user").catch(()=>null)]);
  if(!db){localMode("Archivio non disponibile in questa vista (accesso non effettuato o in anteprima): vedi un sito di esempio e le modifiche non vengono salvate.");return}
  S.mode="db";setSync("busy","Caricamento…");
  if(user){try{S.uid=await user.id()}catch(e){}try{S.canEdit=!!(await user.canEdit())}catch(e){}
    try{const c=await user.can("data.write");if(c===false){S.canWrite=false;banner("Hai accesso in sola lettura: puoi consultare i punteggi ma non modificarli.")}}catch(e){}}
  db.doc("config/params").onSnapshot(sn=>{const d=sn.exists?sn.data():null;S.params=merge(clone(DEF),d?clone(d):{});renderAll(true)},()=>{});
  db.collection("gaps").onSnapshot(sn=>{S.gaps=sn.docs.map(d=>Object.assign({id:d.id},clone(d.data())));if(S.view==="gap")renderGaps()},()=>{});
  db.collection("sites").onSnapshot(sn=>{
    const next={};sn.docs.forEach(d=>{const o=clone(d.data());o.id=d.id;if(pending[d.id])merge(o,clone(pending[d.id]));next[d.id]=o});
    const changedSel=!S.sel||!next[S.sel]||!S.loaded;S.sites=next;S.loaded=true;
    if(changedSel){let saved=null;try{saved=localStorage.getItem("rs-sel")}catch(e){}S.sel=next[saved]?saved:(sitesArr()[0]||{}).id||null}
    if(!Object.keys(pending).length&&!inflight)setSync("ok",S.canWrite?"Salvato":"Sola lettura");
    resolveNames();renderAll(changedSel);
  },e=>{setSync("off","Disconnesso");banner("Connessione all'archivio interrotta: ricarica la pagina per riprendere a salvare.")});
}
async function resolveNames(){if(!user)return;const ids=[...new Set(Object.values(S.sites).map(s=>s.updatedBy).filter(Boolean))].filter(i=>!S.names[i]);if(!ids.length)return;
  try{const ps=await user.profiles(ids);ids.forEach(i=>{S.names[i]=(ps&&ps[i]&&ps[i].name)||""});if(S.view==="sito")renderVerdict()}catch(e){}}
boot();
</script>
